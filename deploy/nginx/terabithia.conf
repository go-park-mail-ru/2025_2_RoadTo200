map $http_upgrade $connection_upgrade {
  default upgrade ;
  '' close ;
}

server {
  listen 80 ;
  server_name terabithia.online ;
  root /home/ubuntu/app ;

  access_log /home/ubuntu/app/logs/nginx/access.log ;
  error_log /home/ubuntu/app/logs/nginx/error.log ;

  # location / {
  #        proxy_pass http://217.16.17.116:8001;
  # }

  location / {
    root /home/ubuntu/app/front;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://localhost:8080;
  }

  location /ws/ {
    proxy_pass http://localhost:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /terabitha-photos/ {
    proxy_pass http://localhost:8099;
  }
}