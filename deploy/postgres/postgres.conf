# ============================================
# PostgreSQL 15 Configuration - Production
# С мониторингом и логгированием для PGBadger
# ============================================

#------------------------------------------------------------------------------
# FILE LOCATIONS
#------------------------------------------------------------------------------

data_directory = '/var/lib/postgresql/data'
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
external_pid_file = '/var/run/postgresql/postgresql.pid'


#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = 'localhost'  # Только локальные подключения для Docker
port = 5432
max_connections = 100
superuser_reserved_connections = 3

# Таймауты подключения
authentication_timeout = 60s
connect_timeout = 15s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 5

# Безопасность
password_encryption = scram-sha-256
ssl = off  # В Docker сети SSL не нужен


#------------------------------------------------------------------------------
# ТАЙМАУТЫ (Важная часть задания!)
#------------------------------------------------------------------------------

# statement_timeout - максимальное время выполнения запроса
# 30 секунд: достаточно для большинства операций, защита от бесконечных запросов
statement_timeout = 30000  # 30 секунд (в миллисекундах)

# lock_timeout - максимальное время ожидания блокировки
# 10 секунд: предотвращает взаимные блокировки и зависания
lock_timeout = 10000  # 10 секунд

# idle_in_transaction_session_timeout - таймаут для транзакций без активности
# 1 минута: убивает "забытые" транзакции
idle_in_transaction_session_timeout = 60000  # 60 секунд

# idle_session_timeout - таймаут для неактивных сессий (только 14+ версия)
# idle_session_timeout = 0  # Отключено, управляется приложением

# Аргументация для ментора:
# 1. 30 секунд на запрос - разумный компромисс между UX и защитой от DOS
# 2. 10 секунд на блокировку - предотвращает deadlock accumulation
# 3. 60 секунд на неактивную транзакцию - очистка "зависших" сессий
# 4. Эти значения соответствуют бизнес-логике dating приложения


#------------------------------------------------------------------------------
# RESOURCE USAGE
#------------------------------------------------------------------------------

shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
effective_io_concurrency = 200
random_page_cost = 1.1


#------------------------------------------------------------------------------
# WRITE AHEAD LOG
#------------------------------------------------------------------------------

wal_level = replica
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on
wal_buffers = 16MB
checkpoint_timeout = 5min
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9


#------------------------------------------------------------------------------
# ЛОГГИРОВАНИЕ МЕДЛЕННЫХ ЗАПРОСОВ (для PGBadger)
#------------------------------------------------------------------------------

# Формат и расположение логов
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_truncate_on_rotation = off

# Ротация логов (для избежания переполнения)
log_rotation_age = 1d
log_rotation_size = 100MB

# Формат строки лога ОЧЕНЬ ВАЖЕН для PGBadger!
log_line_prefix = '%t [%p]: [%l-1] db=%d,user=%u,app=%a,client=%h '

# Что логировать
log_connections = on
log_disconnections = on
log_duration = off  # Логируем только медленные через log_min_duration_statement
log_error_verbosity = default
log_lock_waits = on
log_statement = 'none'  # Не логировать все запросы
log_temp_files = 0  # Логировать все временные файлы > 0 байт

# МЕДЛЕННЫЕ ЗАПРОСЫ - КЛЮЧЕВОЙ ПАРАМЕТР
# 500ms выбрано потому что:
# 1. Пользователи ожидают быстрого отклика в dating приложении
# 2. API запросы не должны занимать больше 500ms
# 3. Это помогает выявить проблемные N+1 запросы
# 4. Достаточно строго для продакшена, но не слишком агрессивно
log_min_duration_statement = 500  # 500 миллисекунд

# Дополнительное логирование для отладки
log_checkpoints = on
log_autovacuum_min_duration = 1000  # Логировать долгие autovacuum (>1 сек)


#------------------------------------------------------------------------------
# pg_stat_statements (сбор статистики по запросам)
#------------------------------------------------------------------------------

# ДОЛЖНО быть в shared_preload_libraries
shared_preload_libraries = 'pg_stat_statements'

# Настройки pg_stat_statements
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on
pg_stat_statements.track_planning = off


#------------------------------------------------------------------------------
# auto_explain (автоматическое объяснение планов запросов)
#------------------------------------------------------------------------------

# auto_explain ТОЖЕ должен быть в shared_preload_libraries
# shared_preload_libraries = 'pg_stat_statements, auto_explain'  # Уже добавлено выше

# Настройки auto_explain
auto_explain.log_min_duration = 1000  # Логировать планы запросов > 1 сек
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_triggers = on
auto_explain.log_verbose = on
auto_explain.log_settings = on
auto_explain.log_wal = off
auto_explain.log_format = text
auto_explain.log_nested_statements = on


#------------------------------------------------------------------------------
# RUNTIME STATISTICS
#------------------------------------------------------------------------------

track_activities = on
track_counts = on
track_io_timing = on
track_functions = none
track_activity_query_size = 2048
stats_temp_directory = '/var/run/postgresql/pg_stat_tmp'


#------------------------------------------------------------------------------
# AUTOVACUUM
#------------------------------------------------------------------------------

autovacuum = on
log_autovacuum_min_duration = 0
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
autovacuum_vacuum_cost_delay = 2ms


#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------

# Эти параметры наследуются всеми клиентами
# (но могут быть переопределены на уровне пользователя/БД)

# Таймауты по умолчанию (дублируем для ясности)
statement_timeout = 30000
lock_timeout = 10000
idle_in_transaction_session_timeout = 60000

# Оптимизации для UTF-8
client_encoding = utf8
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# Временные зоны
timezone = 'UTC'
log_timezone = 'UTC'


#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------

deadlock_timeout = 1s
max_locks_per_transaction = 128


#------------------------------------------------------------------------------
# VERSION/PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------

escape_string_warning = on
standard_conforming_strings = on


#------------------------------------------------------------------------------
# CUSTOMIZED OPTIONS
#------------------------------------------------------------------------------

# Параметр для отслеживания изменений (для репликации/аудита)
track_commit_timestamp = off

# Параметры для планировщика
geqo = on
geqo_threshold = 12
