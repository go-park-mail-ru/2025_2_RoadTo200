# ===========================================
# PostgreSQL Host-Based Authentication File
# Безопасная конфигурация для продакшена
# ===========================================

# Типы подключений:
# - "local" - Unix domain socket
# - "host" - TCP/IP подключения (SSL/без SSL)
# - "hostssl" - Только SSL подключения
# - "hostnossl" - Только не-SSL подключения

# Методы аутентификации:
# - "trust" - без аутентификации (ОПАСНО!)
# - "reject" - отклонить подключение
# - "md5" - парольная аутентификация (устарело)
# - "password" - пароль в открытом виде (ОПАСНО!)
# - "scram-sha-256" - безопасный метод (рекомендуется)
# - "gss" - Kerberos
# - "sspi" - Windows SSPI
# - "ident" - проверка через ident сервер
# - "peer" - проверка через ОС (только Unix sockets)
# - "ldap" - через LDAP сервер
# - "radius" - через RADIUS
# - "cert" - через SSL сертификат
# - "pam" - через PAM

# Формат:
# TYPE  DATABASE        USER            ADDRESS                 METHOD  [OPTIONS]

# ====================
# ЛОКАЛЬНЫЕ ПОДКЛЮЧЕНИЯ (Unix sockets)
# ====================

# Суперпользователь может подключаться через socket без пароля (только локально)
local   all             postgres                                peer

# Все локальные подключения через socket требуют пароля
local   all             all                                     scram-sha-256

# ====================
# TCP/IP ПОДКЛЮЧЕНИЯ
# ====================

# Запрещаем все подключения по умолчанию
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# Разрешаем подключение только с определенных адресов:

# 1. Разрешаем подключение приложения из Docker сети (172.20.0.0/16)
host    Tinder          app_user        172.20.0.0/16           scram-sha-256

# 2. Разрешаем мониторинг и администрирование только с localhost
host    all             postgres        127.0.0.1/32            scram-sha-256
host    all             admin_user      127.0.0.1/32            scram-sha-256


# ====================
# СПЕЦИАЛЬНЫЕ НАСТРОЙКИ
# ====================

# Разрешаем подключение к мониторингу только для read-only пользователя
host    Tinder          monitor_user    172.20.0.0/16           scram-sha-256

# Разрешаем подключение для backup
host    all             backup_user     127.0.0.1/32            scram-sha-256

# ====================
# БАЗЫ ДАННЫХ ДЛЯ ПРИЛОЖЕНИЯ
# ====================

# Основная база данных приложения
host    Tinder          app_user        172.20.0.0/16           scram-sha-256
host    Tinder          app_readonly    172.20.0.0/16           scram-sha-256

# База для миграций (только для CI/CD)
# host    Tinder          deploy_user     10.0.0.0/8              scram-sha-256

# ====================
# СИСТЕМНЫЕ БАЗЫ ДАННЫХ
# ====================

# Запрещаем подключение к системным базам всем, кроме суперпользователя
host    postgres        all             0.0.0.0/0               reject
host    template0       all             0.0.0.0/0               reject
host    template1       all             0.0.0.0/0               reject

# Разрешаем суперпользователю доступ к системным базам только с localhost
host    postgres        postgres        127.0.0.1/32            scram-sha-256
host    template0       postgres        127.0.0.1/32            scram-sha-256
host    template1       postgres        127.0.0.1/32            scram-sha-256


# ====================
# IPv6 КОНФИГУРАЦИЯ
# ====================

# Аналогичные правила для IPv6
host    all             all             ::1/128                 scram-sha-256
host    Tinder          app_user        ::1/128                 scram-sha-256