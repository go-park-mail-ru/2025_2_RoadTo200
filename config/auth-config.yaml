app:
  host: 0.0.0.0
  port: 8081
  prefix: /api/v1
  mode: release
  swagger_path: ./data/docs/auth.json

  logger:
    level: DEBUG

  postgres:
    host: PG_HOST
    port: PG_PORT
    base: PG_BASE
    user: PG_USER
    password: PG_PSWD

  redis:
    host: RD_HOST
    port: RD_PORT
    base: RD_BASE
    password: RD_PSWD

  auth_service:
    port: 50051
