  deploy:
    runs-on: ubuntu-latest
#    needs: lint-and-test
#    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25'

      - name: Install swag
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest

      - name: Add server to known_hosts
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Создаем приватный ключ для SSH
          mkdir -p ~/.ssh
          echo -n "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST echo "SSH connection successful"

      - name: Build
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
        # Запускаем локальный скрипт деплоя
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh "$SERVER_USER@$SERVER_HOST"

