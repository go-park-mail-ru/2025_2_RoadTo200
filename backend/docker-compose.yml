version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: terabithia-postgres
    environment:
      POSTGRES_DB: terabithia_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # ← эта папка выполняется автоматически
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terabithia-redis
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    
  minio:
    image: minio/minio:latest
    container_name: terabithia-minio
    ports:
      - "9000:9000"   # API порт
      - "9001:9001"   # Web UI порт
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc:latest
    container_name: terabithia-minio-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/terabithia-photos;
      /usr/bin/mc anonymous set public myminio/terabithia-photos;
      echo 'Buckets created successfully';
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data: