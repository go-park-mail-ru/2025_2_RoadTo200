basePath: /api
definitions:
  service.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  service.ProfileResponse:
    properties:
      photos: {}
      preferences: {}
      user: {}
    type: object
host: localhost:8080
info:
  contact:
    email: support@datingapp.com
    name: API Support
  description: API для dating приложения
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Terabithia API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и устанавливает сессию
      parameters:
      - description: Учетные данные для входа
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход" example:{"id":"123","email":"user@example.com"}
          schema:
            type: object
        "400":
          description: Неверный формат запроса" example:{"error":"invalid request
            body"}
          schema:
            type: object
        "401":
          description: Неверный email или пароль" example:{"error":"invalid email
            or password"}
          schema:
            type: object
      summary: Вход в систему
      tags:
      - auth
  /logout:
    post:
      description: Завершает текущую сессию пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход" example:{"message":"logged out"}
          schema:
            type: object
        "401":
          description: Сессия не найдена" example:{"error":"no session"}
          schema:
            type: object
        "500":
          description: Внутренняя ошибка сервера" example:{"error":"internal error"}
          schema:
            type: object
      summary: Выход из системы
      tags:
      - auth
  /profile/changeProfile:
    post:
      consumes:
      - multipart/form-data
      - application/json
      description: Update user profile information, upload photos, delete photos,
        set primary photo
      parameters:
      - description: 'Action type: updateInfo, uploadPhotos, deletePhoto, setPrimaryPhoto,
          updatePreferences'
        in: formData
        name: action
        required: true
        type: string
      - description: User name
        in: formData
        name: name
        type: string
      - description: Phone number
        in: formData
        name: phone
        type: string
      - description: Birth date (YYYY-MM-DD)
        in: formData
        name: birth_date
        type: string
      - description: Gender
        in: formData
        name: gender
        type: string
      - description: Bio
        in: formData
        name: bio
        type: string
      - description: Latitude
        in: formData
        name: latitude
        type: number
      - description: Longitude
        in: formData
        name: longitude
        type: number
      - description: Gender preference
        in: formData
        name: show_gender
        type: string
      - description: Minimum age preference
        in: formData
        name: age_min
        type: integer
      - description: Maximum age preference
        in: formData
        name: age_max
        type: integer
      - description: Maximum distance preference
        in: formData
        name: max_distance
        type: integer
      - description: Global search preference
        in: formData
        name: global_search
        type: boolean
      - description: Photo ID for delete/set primary
        in: formData
        name: photo_id
        type: string
      - description: Photos to upload
        in: formData
        name: photos
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/service.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/service.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/service.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update profile
      tags:
      - profile
  /profile/profile:
    get:
      consumes:
      - application/json
      description: Get current user's profile with photos and preferences
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/service.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/service.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get user profile
      tags:
      - profile
  /register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя и устанавливает сессию
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан" example:{"id":"123","email":"user@example.com"}
          schema:
            type: object
        "400":
          description: Неверный формат запроса" example:{"error":"invalid request
            body"}
          schema:
            type: object
        "500":
          description: Внутренняя ошибка сервера" example:{"error":"internal error"}
          schema:
            type: object
      summary: Регистрация пользователя
      tags:
      - auth
  /session:
    get:
      description: Проверяет валидность текущей сессии и возвращает статус аутентификации
      produces:
      - application/json
      responses:
        "200":
          description: Сессия не валидна" example:{"authenticated":false}
          schema:
            type: object
      summary: Проверка сессии
      tags:
      - auth
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
  SessionToken:
    in: cookie
    name: session_token
    type: apiKey
swagger: "2.0"
